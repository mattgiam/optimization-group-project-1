{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MNIST Classifier{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'classifier/css/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if user.is_authenticated %}
  <header class="site-nav">
    <a class="wordmark" href="{% url 'article' %}">mnist&#8725;classify</a>
    <nav>
      <a href="{% url 'article' %}" class="{% block nav_article %}{% endblock %}">Article</a>
      <a href="{% url 'classify' %}" class="{% block nav_classify %}{% endblock %}">Classify</a>
      <form action="{% url 'logout' %}" method="post" class="logout-form">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    </nav>
  </header>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>MNIST Group Project &mdash; <a href="https://github.com/">view the GitHub repo</a></span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
